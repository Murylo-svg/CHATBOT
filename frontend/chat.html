<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sala pública — Agente de IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="status" id="status" role="status" tabindex="0">
    <span class="luz piscando"></span>
    <span class="rotulo">Verificando</span>
  </div>

  <div class="app">
    <header class="topo">
      <div>
        <h2>Sala pública</h2>
        <div class="quem" id="quem"></div>
        <div class="indicadores">
          <span class="conexao conectando" id="conexao" role="status" aria-live="polite">Conectando…</span>
          <span class="online" id="online" title="Usuários conectados agora">
            <span class="ponto"></span><span id="online-total">–</span> online
          </span>
        </div>
      </div>
      <div class="acoes">
        <button type="button" class="botao-fraco" id="abrir-debate" title="Colocar duas IAs para debater">🎭 Debate de IAs</button>
        <button type="button" class="botao-fraco" id="limpar">Limpar histórico</button>
        <button type="button" class="botao-fraco" id="sair">Sair</button>
      </div>
    </header>

    <div class="painel-debate" id="painel-debate" hidden>
      <div>
        <strong>🎭 Debate:</strong> <span id="debate-tema"></span>
        <div class="debate-info" id="debate-info" aria-live="polite"></div>
      </div>
      <button type="button" class="botao-fraco" id="parar-debate">Parar</button>
    </div>

    <div class="conversa" id="conversa" aria-live="polite"></div>

    <div class="aviso-chat" id="aviso-chat" role="alert" hidden></div>

    <footer class="rodape">
      <div class="previa" id="previa">
        <img id="previa-imagem" alt="" />
        <span id="previa-nome"></span>
        <button type="button" id="previa-remover">Remover</button>
      </div>

      <div class="composicao">
        <button type="button" class="icone" id="anexar" title="Enviar imagem" aria-label="Enviar imagem">+</button>
        <input type="file" id="arquivo" accept="image/*" hidden />
        <textarea id="texto" rows="1" placeholder="Escreva para a sala. Use @gemini ou @bot para chamar a IA" maxlength="2000"></textarea>
        <button type="button" class="icone enviar" id="enviar" title="Enviar" aria-label="Enviar">&#8593;</button>
      </div>
    </footer>
  </div>

  <dialog class="dialogo-debate" id="dialogo-debate">
    <form method="dialog" id="form-debate">
      <h2>Debate de IAs</h2>
      <p>🤖 <strong>Gemini</strong> defende um lado e a segunda IA (✨ <strong>Gemini 2</strong> ou 🌀 <strong>Mistral</strong>, conforme o servidor) o outro. Todos na sala assistem.</p>
      <label for="debate-tema-campo">Tema</label>
      <input id="debate-tema-campo" maxlength="200" required placeholder="Ex.: Pizza com abacaxi deveria ser proibida?" />
      <div class="linha-campos">
        <div>
          <label for="debate-turnos">Falas no total</label>
          <select id="debate-turnos">
            <option value="4">4 (2 de cada)</option>
            <option value="6">6 (3 de cada)</option>
            <option value="8" selected>8 (4 de cada)</option>
            <option value="12">12 (6 de cada)</option>
          </select>
        </div>
        <div>
          <label for="debate-intervalo">Tempo entre falas</label>
          <select id="debate-intervalo">
            <option value="5">5 segundos</option>
            <option value="8" selected>8 segundos</option>
            <option value="12">12 segundos</option>
            <option value="20">20 segundos</option>
          </select>
        </div>
      </div>
      <div class="botoes-dialogo">
        <button type="button" class="botao-fraco" id="cancelar-debate">Cancelar</button>
        <button type="submit" class="botao-principal" id="iniciar-debate">Começar debate</button>
      </div>
    </form>
  </dialog>

  <!-- Cliente Socket.io 4.8.4 (mesma versao do servidor), servido junto com o front -->
  <script src="js/vendor/socket.io.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/status.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
